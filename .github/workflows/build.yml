name: Build NotMenu

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:   # Actions sekmesinden elle de çalıştırabilirsin

permissions:
  contents: write      # tag atınca Release oluşturabilmesi için

jobs:
  build:
    runs-on: macos-14   # Apple Silicon, Xcode 15+ (Swift 5.9 ile uyumlu)
    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: Swift sürümü
        run: swift --version

      - name: Derle (.app oluştur)
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Zip'le (ditto izinleri korur)
        run: ditto -c -k --sequesterRsrc --keepParent NotMenu.app NotMenu-macOS.zip

      - name: Artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: NotMenu-macOS
          path: NotMenu-macOS.zip

      - name: Release oluştur (sadece v* tag'inde)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: NotMenu-macOS.zip
