name: Build Plan

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:   # Actions sekmesinden elle de çalıştırabilirsin

permissions:
  contents: write      # tag atınca Release oluşturabilmesi için

jobs:
  build:
    runs-on: macos-latest   # Swift 6.2 (Xcode 26+) gerekir: Package.swift tools-version 6.2
    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: Xcode seç (Swift 6.2 için Xcode 26+)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Swift sürümü
        run: swift --version

      - name: Dizin yapısını göster (teşhis)
        run: |
          echo "--- pwd"; pwd
          echo "--- kök"; ls -la
          echo "--- Sources"; ls -laR Sources | head -40 || true
          echo "--- Package.swift (gizli karakterler dahil)"; cat -etv Package.swift || true
          echo "--- git'te izlenen dosyalar"; git ls-files | head -60

      - name: Birim testleri (Notlarım depolama katmanı)
        run: swift test

      - name: Derle (.app + .zip oluştur)
        run: |
          chmod +x build.sh scripts/build_share.sh
          ./build.sh

      - name: Artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: Plan-macOS
          path: Plan-macOS.zip
          if-no-files-found: error

      - name: Release oluştur (sadece v* tag'inde)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Plan-macOS.zip
