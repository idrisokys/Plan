name: Build Plan

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:   # Actions sekmesinden elle de çalıştırabilirsin

permissions:
  contents: write      # tag atınca Release oluşturabilmesi için

jobs:
  build:
    runs-on: macos-15   # Apple Silicon, Xcode 15+ (Swift 5.9 ile uyumlu)
    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: Swift sürümü
        run: swift --version

      - name: Dizin yapısını göster (teşhis)
        run: |
          echo "--- pwd"; pwd
          echo "--- kök"; ls -la
          echo "--- Sources"; ls -laR Sources | head -40 || true
          echo "--- Package.swift (gizli karakterler dahil)"; cat -A Package.swift
          echo "--- git'te izlenen dosyalar"; git ls-files | head -60

      - name: Birim testleri (Notlarım depolama katmanı)
        run: swift test

      - name: Derle (.app + .zip oluştur)
        run: |
          chmod +x build.sh scripts/build_share.sh
          ./build.sh

      - name: Artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: Plan-macOS
          path: Plan-macOS.zip
          if-no-files-found: error

      - name: Release oluştur (sadece v* tag'inde)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Plan-macOS.zip
