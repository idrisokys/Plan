[package]
name = "plan-gui"
version = "2.0.0"
edition = "2021"
license = "MIT"
description = "Plan / Notlarım — egui arayüzü + sistem tepsisi (plan-core üzerinde)"

# Ana çalışma alanından bağımsız (dış bağımlılıkları var; ağ erişimi olan bir makinede derlenir).
[workspace]

[[bin]]
name = "plan-gui"
path = "src/main.rs"

[dependencies]
plan-core = { path = "../plan-core" }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
tray-icon = "0.19"
mdns-sd = "0.11"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png"] }
