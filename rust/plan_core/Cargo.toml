[package]
name = "plan_core"
version = "0.1.0"
edition = "2021"
description = "Plan uygulamasının CPU yoğun işleri: arama, Türkçe metin sadeleştirme, paylaşım köprüsü"
publish = false

# Dış (crates.io) bağımlılık yok: yalnızca std + yerel `qshare_core`. Böylece çevrimdışı derlenir.
# Paylaşım/eşitleme protokolü ve Unicode (NFC/NFD) Android'le ORTAK olan qshare_core'dadır.
[dependencies]
qshare_core = { path = "../../qshare_core" }

[lib]
name = "plan_core"
crate-type = ["staticlib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
