[package]
name = "plan_core"
version = "0.1.0"
edition = "2021"
description = "Plan uygulamasının CPU yoğun işleri: tarama, arama, hash/metadata, küçük resim"
publish = false

# Bağımlılık yok: yalnızca std. Böylece çevrimdışı derlenir ve CI'da ek kurulum gerekmez.
[dependencies]

[lib]
name = "plan_core"
crate-type = ["staticlib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
